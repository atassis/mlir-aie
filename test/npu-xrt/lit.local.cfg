config.suffixes = [".lit", ".py"]

# Gate on lit features rather than vitis_components to enable Peano.
backend_features = {"aietools_aie2", "aietools_aie2p", "peano"}
if not backend_features.intersection(set(config.available_features)):
    config.unsupported = True

config.excludes.add("util.py")
# Design script driven by matmul_whole_array_dynamic/run.lit, not a test itself.
config.excludes.add("whole_array_dynamic.py")

# NOTE: the split assumes both lit passes share one clean filesystem/exec-root;
# a stale artifact from a prior run could otherwise let execute pass on a stale
# xclbin.
#
# Two resources need bounding and they are not the same resource, so the group is
# decided PER-TEST by an importable callable (importable so lit can pickle it to
# its parallel workers -- a function defined here in the exec'd config cannot be).
# Device dispatch is serialized inside utils/run_on_npu.py, around the dispatch
# only, so each test's compile -- ~99% of its wall time, and no device needed --
# runs in parallel; where fcntl is unavailable that lock does not exist and the
# capacity-1 npu-xrt group goes back in force for anything that still reaches the
# device. Chess compile memory is bounded separately, on every platform, because
# it has nothing to do with the device. See npu_split_parallelism_group.
from aie_lit_utils.lit_config_helpers import npu_split_parallelism_group

config.parallelism_group = npu_split_parallelism_group
